<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Team-YM 博客集合，浏览团队成员的个人博客。">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Team-YM · BLOGS</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #070a12;
            --panel: rgba(15, 22, 38, .78);
            --line: rgba(126, 161, 220, .24);
            --text: #edf4ff;
            --muted: #91a1bd;
            --cyan: #5eead4;
            --blue: #60a5fa;
            --pink: #f472b6;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(96, 165, 250, .18), transparent 32rem),
                radial-gradient(circle at 85% 80%, rgba(244, 114, 182, .12), transparent 30rem),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .2;
            background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, #000, transparent 85%);
        }

        .wrap { width: min(1080px, calc(100% - 36px)); margin: 0 auto; position: relative; }
        header { padding: 82px 0 48px; }
        .eyebrow { color: var(--cyan); font: 700 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .22em; }
        h1 { margin: 14px 0 18px; max-width: 720px; font-size: clamp(42px, 8vw, 86px); line-height: .98; letter-spacing: -.06em; }
        h1 span { color: var(--cyan); text-shadow: 0 0 28px rgba(94,234,212,.35); }
        .intro { max-width: 610px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.8; }
        .header-line { width: 100%; height: 1px; margin-top: 42px; background: linear-gradient(90deg, var(--cyan), var(--blue), transparent); opacity: .7; }

        .section-heading { display: flex; align-items: center; gap: 14px; margin: 0 0 20px; }
        .section-heading h2 { margin: 0; font-size: 18px; letter-spacing: .08em; }
        .count { color: var(--cyan); font: 12px ui-monospace, monospace; }
        .section-heading::after { content: ""; flex: 1; height: 1px; background: var(--line); }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
        .card {
            display: flex; flex-direction: column; min-height: 310px; padding: 28px;
            color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 18px;
            background: linear-gradient(145deg, var(--panel), rgba(9, 14, 26, .84));
            box-shadow: 0 18px 50px rgba(0,0,0,.22); transition: transform .28s ease, border-color .28s ease, box-shadow .28s ease;
            overflow: hidden; position: relative;
        }
        .card::after { content: ""; position: absolute; width: 180px; height: 180px; right: -70px; top: -70px; border-radius: 50%; background: var(--glow); filter: blur(20px); opacity: .16; }
        .card:hover { transform: translateY(-7px); border-color: var(--accent); box-shadow: 0 24px 60px rgba(0,0,0,.38), 0 0 28px var(--shadow); }
        .card-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font: 12px ui-monospace, monospace; letter-spacing: .08em; }
        .status { color: var(--accent); }
        .avatar { width: 82px; height: 82px; margin: 34px 0 22px; border: 2px solid var(--accent); border-radius: 50%; object-fit: cover; box-shadow: 0 0 24px var(--shadow); }
        .card h3 { margin: 0 0 10px; font-size: 29px; letter-spacing: -.03em; }
        .card p { margin: 0; color: var(--muted); line-height: 1.7; }
        .open { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 28px; color: var(--accent); font-weight: 700; }
        .open::after { content: "↗"; font-size: 20px; transition: transform .2s; }
        .card:hover .open::after { transform: translate(3px, -3px); }
        footer { padding: 80px 0 34px; color: var(--muted); font: 12px ui-monospace, monospace; display: flex; justify-content: space-between; gap: 20px; }

        @media (max-width: 680px) {
            header { padding-top: 52px; }
            .grid { grid-template-columns: 1fr; }
            .card { min-height: 290px; }
            footer { flex-direction: column; padding-top: 56px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="eyebrow">TEAM-YM / PERSONAL BLOG NETWORK</div>
            <h1>Stories from<br><span>our corner.</span></h1>
            <p class="intro">这里收录 Team-YM 成员的个人博客。选择一个节点，进入他们各自构建的兴趣、想法与生活空间。</p>
            <div class="header-line"></div>
        </header>

        <main>
            <div class="section-heading"><span class="count">[02]</span><h2>AVAILABLE BLOGS</h2></div>
            <div class="grid">
                <a class="card" href="blog/cuteFish-blog.html" style="--accent:#5eead4;--shadow:rgba(94,234,212,.28);--glow:#5eead4">
                    <div class="card-top"><span>NODE / CF-01</span><span class="status">● ONLINE</span></div>
                    <img class="avatar" src="photo/cuteFish/avatar.jpg" alt="cute-Fish 的头像" onerror="this.style.display='none'">
                    <h3>cute-Fish</h3>
                    <p>人间过客，自在而行。记录游戏、动漫、音乐与编程，也记录独处时的思考。</p>
                    <div class="open">进入博客</div>
                </a>

                <a class="card" href="blog/qiamao-blog.html" style="--accent:#00f3ff;--shadow:rgba(0,243,255,.25);--glow:#ff2a8d">
                    <div class="card-top"><span>NODE / QM-02</span><span class="status">● ONLINE</span></div>
                    <img class="avatar" src="photo/qiamao/avatar.jpg" alt="qiamao 的头像" onerror="this.style.display='none'">
                    <h3>qiamao</h3>
                    <p>我渴望快乐。探索编程、游戏、动漫与和风文化的个人空间。</p>
                    <div class="open">进入博客</div>
                </a>
            </div>
        </main>

        <footer><span>© 2026 Team-YM</span></footer>
    </div>
</body>
</html>
